openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RealEstate Vault API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: deals
  - name: brokers
  - name: professionals
  - name: deal-team
  - name: deal-advisory
  - name: deal-ai
  - name: mandates
  - name: access
  - name: auth
  - name: messages
  - name: dashboard
  - name: notifications
  - name: transactions
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /users/me/role:
    post:
      tags: [Auth]
      operationId: setMyRole
      summary: Set the current user's marketplace role (broker, investor, or owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleBody'
      responses:
        '200':
          description: Role set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current session info
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/deal-teasers:
    get:
      operationId: listPublicDealTeasers
      tags: [deals]
      summary: Anonymous, redacted teasers of live deals for the public homepage
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Redacted deal teasers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicDealTeaser" }
  /public/stats:
    get:
      operationId: getPublicPlatformStats
      tags: [dashboard]
      summary: Anonymous aggregate platform statistics for the public homepage
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPlatformStats" }
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List deals with optional filters
      parameters:
        - name: assetClass
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: dealType
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: savedOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deal" }
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a deal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get deal detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/save:
    patch:
      operationId: toggleSaveDeal
      tags: [deals]
      summary: Toggle saved state for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
  /deals/{id}/documents:
    get:
      operationId: listDealDocuments
      tags: [deals]
      summary: Data room documents for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealDocument" }
    post:
      operationId: createDealDocument
      tags: [deals]
      summary: Register an uploaded data room document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealDocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDocument" }
        "404":
          description: Deal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/documents/{docId}:
    patch:
      operationId: updateDealDocument
      tags: [deals]
      summary: Update a data room document's metadata (broker only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealDocumentUpdate" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDocument" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    delete:
      operationId: deleteDealDocument
      tags: [deals]
      summary: Delete a data room document (broker only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/documents/{docId}/download:
    get:
      operationId: downloadDealDocument
      tags: [deals]
      summary: Download a data room document (NDA-gated)
      description: |
        Streams the document file. NDA-required documents need an
        accessRequestId referencing a signed-NDA access request for the deal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: File stream
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: NDA not signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: File not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Object not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/access-requests:
    post:
      operationId: requestDealAccess
      tags: [access]
      summary: Request confidential access to a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestCreateResult" }
  /access-requests:
    get:
      operationId: listAccessRequests
      tags: [access]
      summary: List access requests
      responses:
        "200":
          description: Access requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessRequest" }
  /access-requests/{id}:
    patch:
      operationId: updateAccessRequest
      tags: [access]
      summary: Advance an access request through its lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestUpdateResult" }
  /access-requests/{id}/sign:
    post:
      operationId: signAccessRequestNda
      tags: [access]
      summary: Investor signs the NDA for their own access request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignNdaInput" }
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
  /brokers:
    get:
      operationId: listBrokers
      tags: [brokers]
      summary: Ranked list of brokers
      responses:
        "200":
          description: Brokers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Broker" }
  /brokers/me:
    get:
      operationId: getMyBrokerProfile
      tags: [brokers]
      summary: The current broker's directory profile (null if not created yet)
      responses:
        "200":
          description: Profile envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerProfileEnvelope" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not a broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    put:
      operationId: upsertMyBrokerProfile
      tags: [brokers]
      summary: Create or update the current broker's directory profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not a broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /brokers/{id}:
    get:
      operationId: getBroker
      tags: [brokers]
      summary: Broker profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /brokers/{id}/deals:
    get:
      operationId: listBrokerDeals
      tags: [brokers]
      summary: Active listings owned by a broker profile (non-active deals are excluded)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The broker's deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deal" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /professionals:
    get:
      operationId: listProfessionals
      tags: [professionals]
      summary: Ranked professionals directory across all categories. Ranking blends reputation score, verification tier and review quality — never transaction volume alone.
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: Category slug from /professionals/categories.
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Free-text match on name, company or city.
      responses:
        "200":
          description: Professionals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Broker" }
  /professionals/categories:
    get:
      operationId: listProfessionalCategories
      tags: [professionals]
      summary: Canonical professional categories with live member counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfessionalCategory" }
  /professionals/{id}/reviews:
    get:
      operationId: listProfessionalReviews
      tags: [professionals]
      summary: Verified-engagement reviews for a professional profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfessionalReview" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    post:
      operationId: createProfessionalReview
      tags: [professionals]
      summary: Submit a review. Eligibility is derived server-side from an accepted connection with the professional; verification can never be asserted by the client.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalReviewInput" }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalReview" }
        "400":
          description: Invalid ratings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: No accepted engagement with this professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Already reviewed this engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/team:
    get:
      operationId: getDealTeam
      tags: [deal-team]
      summary: Deal team roles and members. Managers see everything; engaged professionals see the appointed team only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealTeamResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deal-team/candidates:
    get:
      operationId: listDealTeamCandidates
      tags: [deal-team]
      summary: Ranked professional candidates for a deal role, with reasoned match scores (never volume-based).
      parameters:
        - name: dealId
          in: query
          required: true
          schema: { type: integer }
        - name: role
          in: query
          required: true
          schema: { type: string }
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidateMatch" }
        "400":
          description: Unknown role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not the deal manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/team/invitations:
    post:
      operationId: createTeamInvitation
      tags: [deal-team]
      summary: Invite a professional to a deal role with scope, data-room permissions and an optional fee proposal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInvitationInput" }
      responses:
        "201":
          description: Created engagement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementWithProfessional" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not the deal manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Professional already engaged for this role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /engagements/mine:
    get:
      operationId: listMyEngagements
      tags: [deal-team]
      summary: Engagements for the signed-in professional (their workspace).
      responses:
        "200":
          description: Engagements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyEngagement" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /engagements/{id}:
    patch:
      operationId: updateEngagement
      tags: [deal-team]
      summary: Advance the engagement lifecycle. Professionals respond (interested / request info / decline); the deal manager appoints, activates, cancels or completes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
