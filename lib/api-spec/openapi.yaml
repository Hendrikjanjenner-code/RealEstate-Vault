      properties:
        activeDeals: { type: integer }
        accessRequests: { type: integer }
        ndasSigned: { type: integer }
        pipelineValue: { type: number }
        closedVolume: { type: number }
        activeMandates: { type: integer }
        unreadMessages: { type: integer }
        dealActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityPoint" }
        assetClassBreakdown:
          type: array
          items: { $ref: "#/components/schemas/AssetClassCount" }
    ActivityPoint:
      type: object
      required: [date, views, requests]
      properties:
        date: { type: string }
        views: { type: integer }
        requests: { type: integer }
    AssetClassCount:
      type: object
      required: [assetClass, count, value]
      properties:
        assetClass: { type: string }
        count: { type: integer }
        value: { type: number }
    Notification:
      type: object
      required: [id, type, message, read, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, description: "e.g. access_request_status" }
        message: { type: string }
        dealId: { type: ["integer", "null"] }
        accessRequestId: { type: ["integer", "null"] }
        read: { type: boolean }
        createdAt: { type: string }
    MarkNotificationsReadResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        description: { type: string }
        createdAt: { type: string }
    HealthComponent:
      type: object
      required: [key, label, score, weight, dataUsed, missingData]
      properties:
        key: { type: string }
        label: { type: string }
        score: { type: integer, description: "0-100 component score" }
        weight: { type: number }
        dataUsed:
          type: array
          items: { type: string }
        missingData:
          type: array
          items: { type: string }
    ChecklistItemStatus:
      type: object
      required: [itemId, name, category, required, status]
      properties:
        itemId: { type: integer }
        name: { type: string }
        category: { type: string }
        required: { type: boolean }
        status:
          type: string
          enum: [available, missing, outdated, needs_signature, needs_review]
        note: { type: ["string", "null"] }
    DocumentReadiness:
      type: object
      required: [templateId, templateName, readinessPct, items]
      properties:
        templateId: { type: ["integer", "null"] }
        templateName: { type: ["string", "null"] }
        readinessPct: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItemStatus" }
    NextBestAction:
      type: object
      required: [title, description, tab]
      properties:
        title: { type: string }
        description: { type: string }
        # Deal Room tab where the action can be taken.
        tab: { type: string }
    AiSourceReference:
      type: object
      required: [id, findingId, documentId]
      properties:
        id: { type: integer }
        findingId: { type: integer }
        documentId: { type: integer }
        documentName: { type: string, nullable: true }
        page: { type: integer, nullable: true }
        section: { type: string, nullable: true }
        excerpt: { type: string, nullable: true }
    AiFinding:
      type: object
      required: [id, runId, dealId, category, title, confidence, reviewStatus, createdAt, sources]
      properties:
        id: { type: integer }
        runId: { type: integer }
        dealId: { type: integer }
        documentId: { type: integer, nullable: true }
        documentName: { type: string, nullable: true }
        category:
          type: string
          enum: [document_type, date, party, expiration, financial_value, clause, attention_point, missing_information, related_document, legal, tax]
        title: { type: string }
        detail: { type: string, nullable: true }
        severity: { type: string, nullable: true, enum: [low, medium, high, null] }
        confidence: { type: string, enum: [high, medium, low] }
        reviewStatus:
          type: string
          enum: [ai_generated, professional_reviewed, verified]
        reviewedByName: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AiSourceReference" }
    AiAnalysisRun:
      type: object
      required: [id, dealId, kind, status, model, createdAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        documentId: { type: integer, nullable: true }
        kind: { type: string }
        status: { type: string, enum: [running, completed, failed] }
        model: { type: string }
        error: { type: string, nullable: true }
        requestedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    AiDocumentSummary:
      type: object
      required: [whatIsThisDocument, whyRelevantToTransaction, keyCommercialPoints, importantDates, obligationsAndConditions, attentionPoints, professionalVerificationNeeded]
      properties:
        whatIsThisDocument: { type: string }
        whyRelevantToTransaction: { type: string }
        keyCommercialPoints:
          type: array
          items: { type: string }
        importantDates:
          type: array
          items: { type: string }
        obligationsAndConditions:
          type: array
          items: { type: string }
        attentionPoints:
          type: array
          items: { type: string }
        professionalVerificationNeeded: { type: string }
    DocumentAnalysisResponse:
      type: object
      required: [findings, disclaimer]
      properties:
        run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AiAnalysisRun"
        summary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AiDocumentSummary"
        findings:
          type: array
          items: { $ref: "#/components/schemas/AiFinding" }
        disclaimer: { type: string }
    FindingReviewBody:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus:
          type: string
          enum: [ai_generated, professional_reviewed, verified]
    AiAssistantMessage:
      type: object
      required: [id, dealId, role, content, restricted, createdAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        restricted: { type: boolean }
        createdAt: { type: string, format: date-time }
    AssistantQuestionBody:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
