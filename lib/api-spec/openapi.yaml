        city: { type: string, minLength: 1 }
        areaSqm: { type: ["number", "null"], minimum: 0 }
        indicativeValue: { type: ["number", "null"], minimum: 0 }
        goal: { type: string, enum: [sell, lease, valuation] }
        description: { type: ["string", "null"] }
    OwnerAssignmentStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, closed] }
    BrokerConnection:
      type: object
      required: [id, ownerUserId, ownerName, brokerId, brokerName, message, status, createdAt]
      properties:
        id: { type: integer }
        ownerUserId: { type: string }
        ownerName: { type: string }
        ownerCompany: { type: ["string", "null"] }
        brokerId: { type: integer }
        brokerName: { type: string }
        brokerCompany: { type: ["string", "null"] }
        assignmentId: { type: ["integer", "null"] }
        assignmentTitle: { type: ["string", "null"] }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        threadId: { type: ["integer", "null"] }
        createdAt: { type: string }
        respondedAt: { type: ["string", "null"] }
    BrokerConnectionInput:
      type: object
      required: [brokerId, message]
      properties:
        brokerId: { type: integer }
        assignmentId: { type: ["integer", "null"] }
        message: { type: string, minLength: 1 }
    BrokerConnectionRespondInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined] }
    DashboardStats:
      type: object
