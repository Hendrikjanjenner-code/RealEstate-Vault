        riskSummary:
          type: object
          required: [total, open, critical, high]
          properties:
            total: { type: integer }
            open: { type: integer }
            critical: { type: integer }
            high: { type: integer }
        teamSummary:
          type: object
          required: [appointed, totalRoles]
          properties:
            appointed: { type: integer }
            totalRoles: { type: integer }
        nextActions:
          type: array
          items: { $ref: "#/components/schemas/NextBestAction" }
        canManage: { type: boolean }
