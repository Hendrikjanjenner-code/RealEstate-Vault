  /connections:
    get:
      operationId: listBrokerConnections
      tags: [network]
      summary: Connection requests — owners see sent, brokers see received
      responses:
        "200":
          description: Connection requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BrokerConnection" }
    post:
      operationId: createBrokerConnection
      tags: [network]
      summary: Send a connection request to a broker (owners only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConnectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConnection" }
  /connections/{id}:
    patch:
      operationId: respondBrokerConnection
      tags: [network]
      summary: Accept or decline a connection request (addressed broker only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerConnectionRespondInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerConnection" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Current user's in-app notifications, newest first
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkNotificationsReadResult" }
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Aggregated dashboard KPIs and chart series
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }
  /dashboard/activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ApiOk:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: [string, 'null']
          description: "broker | investor | owner. Null until the user chooses a role."
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    SetRoleBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [broker, investor, owner]
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    PublicDealTeaser:
      type: object
      description: >-
        Redacted, pre-NDA teaser of a live deal. Never contains exact title,
        city, broker identity, prices, or documents.
      required: [id, title, assetClass, country, valueBand, confidential]
      properties:
        id: { type: integer }
        title:
          type: string
          description: Masked title derived from the asset class, never the real title.
        assetClass: { type: string }
        country: { type: string }
        region: { type: ["string", "null"] }
        valueBand:
          type: string
          description: Coarse value band (e.g. "€25–50M"), or "On request".
        grossYield: { type: ["number", "null"] }
        confidential: { type: boolean }
    PublicPlatformStats:
      type: object
      required: [pipelineValue, liveDeals, verifiedProfessionals]
      properties:
        pipelineValue:
          type: number
          description: Sum of asking prices of active deals, in EUR.
        liveDeals: { type: integer }
        verifiedProfessionals:
          type: integer
          description: >-
            Distinct verified professionals: verified broker profiles plus
            registered users with a marketplace role, without double-counting
            users linked to a verified broker profile.
    Deal:
      type: object
      required:
        [id, title, dealType, assetClass, country, city, currency, status, confidential, saved, views, accessRequests, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        dealType: { type: string }
        transactionStructure:
          type: ["string", "null"]
          description: "e.g. asset_deal | share_deal; used for checklist template matching."
        assetClass: { type: string }
        country: { type: string }
        city: { type: string }
        region: { type: ["string", "null"] }
        locationPrivacy: { type: ["string", "null"] }
        askingPrice: { type: ["number", "null"] }
        priceMax: { type: ["number", "null"] }
        currency: { type: string }
        grossYield: { type: ["number", "null"] }
        netYield: { type: ["number", "null"] }
        areaSqm: { type: ["number", "null"] }
        keys: { type: ["integer", "null"] }
        constructionYear: { type: ["integer", "null"] }
        occupancyPct: { type: ["number", "null"] }
        status: { type: string }
        confidential: { type: boolean }
        saved: { type: boolean }
        teaser: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        brokerId: { type: ["integer", "null"] }
        brokerName: { type: ["string", "null"] }
        brokerCompany: { type: ["string", "null"] }
        brokerProfileId:
          type: ["integer", "null"]
          description: "Directory profile id of the owning broker's real account, if they created one."
        views: { type: integer }
        accessRequests: { type: integer }
        createdAt: { type: string }
        accessStatus:
          type: ["string", "null"]
          description: "Current viewer's access to confidential details: granted | pending | approved | nda_sent | rejected | none"
    DealInput:
      type: object
      required: [title, dealType, assetClass, country, city, currency]
      properties:
        title: { type: string, minLength: 1 }
        dealType: { type: string }
        transactionStructure: { type: string }
        assetClass: { type: string }
        country: { type: string }
        city: { type: string }
        region: { type: string }
        locationPrivacy: { type: string }
        askingPrice: { type: number }
        priceMax: { type: number }
        currency: { type: string }
        grossYield: { type: number }
        netYield: { type: number }
        areaSqm: { type: number }
        keys: { type: integer }
        constructionYear: { type: integer }
        occupancyPct: { type: number }
        confidential: { type: boolean }
        teaser: { type: string }
        description: { type: string }
        imageUrl: { type: string }
    DealDocument:
      type: object
      required: [id, dealId, name, category, sizeKb, ndaRequired, hasFile, uploadedAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        name: { type: string }
        category: { type: string }
        sizeKb: { type: integer }
        ndaRequired: { type: boolean }
        hasFile: { type: boolean, description: "True when a file has been uploaded; objectPath is never exposed to clients." }
        uploadedAt: { type: string }
    DealDocumentInput:
      type: object
      required: [name, category, sizeKb, objectPath]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        sizeKb: { type: integer, minimum: 0 }
        ndaRequired: { type: boolean }
        objectPath: { type: string, minLength: 1 }
        contentType: { type: string }
    DealDocumentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        ndaRequired: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    AccessRequest:
      type: object
      required: [id, dealId, dealTitle, requesterName, requesterCompany, status, createdAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        dealTitle: { type: string }
        requesterName: { type: string }
        requesterCompany: { type: string }
        message: { type: ["string", "null"] }
        status: { type: string, description: "pending | approved | nda_sent | nda_signed | rejected" }
        signerName: { type: ["string", "null"] }
        signedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    AccessRequestCreateResult:
      allOf:
        - $ref: "#/components/schemas/AccessRequest"
        - type: object
          properties:
            requestKey:
              type: string
              description: "Secret issued to the requester at creation; lets them self-sign the NDA and check status without a session. Only returned at creation."
    AccessRequestUpdateResult:
      allOf:
        - $ref: "#/components/schemas/AccessRequest"
        - type: object
          properties:
            downloadToken:
              type: ["string", "null"]
              description: "Capability token for NDA-gated downloads; only returned when the transition is to nda_signed."
    AccessRequestInput:
      type: object
      required: [requesterName, requesterCompany]
      properties:
        requesterName: { type: string, minLength: 1 }
        requesterCompany: { type: string, minLength: 1 }
        message: { type: string }
    AccessRequestUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        requestKey:
          type: string
          description: "Secret issued to the requester at creation; required to transition to nda_signed."
    SessionResponse:
      type: object
      required: [broker]
      properties:
        broker: { type: boolean }
    SignNdaInput:
      type: object
      required: [signerName, agreed]
      properties:
        signerName: { type: string, minLength: 1 }
        agreed: { type: boolean }
    Broker:
      type: object
      required: [id, name, company, title, city, country, verified, score, closedDeals, transactionVolume, yearsExperience, specialisations, isDemo, category, verificationStatus, countries, languages, assetClasses, credentials]
      properties:
        id: { type: integer }
        userId: { type: ["string", "null"], description: "Auth user id this profile belongs to. Null for demo personas." }
        isDemo: { type: boolean, description: "True for seeded demo personas not tied to a real account." }
        name: { type: string }
        company: { type: string }
        title: { type: string }
        city: { type: string }
        country: { type: string }
        verified: { type: boolean }
        score: { type: number }
        closedDeals: { type: integer }
        transactionVolume: { type: number }
        yearsExperience: { type: integer }
        specialisations:
          type: array
          items: { type: string }
        bio: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        category: { type: string, description: "Professional category slug (e.g. brokers, legal_advisors). The canonical list comes from /professionals/categories." }
        verificationStatus:
          type: string
          enum: [unverified, verification_pending, verified_professional, verified_firm, specialist_verified]
        countries:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        assetClasses:
          type: array
          items: { type: string }
        credentials:
          type: array
          items: { type: string }
        avgResponseHours: { type: ["number", "null"], description: "Typical first-response time in hours, when known." }
        avgRating: { type: ["number", "null"], description: "Average overall rating from verified-engagement reviews (1-10), null when unreviewed." }
        reviewCount: { type: integer, description: "Number of verified-engagement reviews." }
    ProfessionalCategory:
      type: object
      required: [id, label, count]
      properties:
        id: { type: string, description: "Stable category slug used as the filter value." }
        label: { type: string }
        count: { type: integer, description: "Number of professionals currently in this category." }
    ProfessionalReview:
      type: object
      required: [id, professionalId, reviewerName, source, verifiedEngagement, ratingExpertise, ratingCommunication, ratingSpeed, ratingQuality, ratingProfessionalism, ratingDealUnderstanding, ratingOverall, createdAt]
      properties:
        id: { type: integer }
        professionalId: { type: integer }
        reviewerName: { type: string }
        reviewerCompany: { type: ["string", "null"] }
        source:
          type: string
          enum: [connection, seeded]
          description: "connection = created via the authenticated endpoint against an accepted connection; seeded = editorial demo content, only served on demo profiles."
        verifiedEngagement: { type: boolean, description: "Derived server-side from the engagement linkage; never accepted from clients." }
        ratingExpertise: { type: number }
        ratingCommunication: { type: number }
        ratingSpeed: { type: number }
        ratingQuality: { type: number }
        ratingProfessionalism: { type: number }
        ratingDealUnderstanding: { type: number }
        ratingOverall: { type: number }
        comment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ProfessionalReviewInput:
      type: object
      required: [ratingExpertise, ratingCommunication, ratingSpeed, ratingQuality, ratingProfessionalism, ratingDealUnderstanding, ratingOverall]
      properties:
        ratingExpertise: { type: number, minimum: 1, maximum: 10 }
        ratingCommunication: { type: number, minimum: 1, maximum: 10 }
        ratingSpeed: { type: number, minimum: 1, maximum: 10 }
        ratingQuality: { type: number, minimum: 1, maximum: 10 }
        ratingProfessionalism: { type: number, minimum: 1, maximum: 10 }
        ratingDealUnderstanding: { type: number, minimum: 1, maximum: 10 }
        ratingOverall: { type: number, minimum: 1, maximum: 10 }
        comment: { type: string }
    DealTeamRole:
      type: object
      required: [id, label, category]
      properties:
        id: { type: string }
        label: { type: string }
        category:
          type: string
          description: "Professional marketplace category this role recruits from."
    DocumentPermission:
      type: object
      required: [category, permission]
      properties:
        category: { type: string }
        permission:
          type: string
          enum: [view, download, no_access]
    FeeProposal:
      type: object
      required: [id, engagementId, proposedByUserId, proposedByName, feeType, currency, vatIncluded, status, createdAt]
      properties:
        id: { type: integer }
        engagementId: { type: integer }
        proposedByUserId: { type: string }
        proposedByName: { type: string }
        feeType:
          type: string
          enum: [fixed, hourly, percentage, success, retainer, custom]
        amount: { type: ["number", "null"] }
        currency: { type: string }
        percentage: { type: ["number", "null"] }
        vatIncluded: { type: boolean }
        paymentTerms: { type: ["string", "null"] }
        scopeDescription: { type: ["string", "null"] }
        status:
          type: string
          enum: [proposed, accepted, rejected, superseded]
        createdAt: { type: string, format: date-time }
    FeeProposalInput:
      type: object
      required: [feeType]
      properties:
        feeType:
          type: string
          enum: [fixed, hourly, percentage, success, retainer, custom]
        amount: { type: number }
        currency: { type: string }
        percentage: { type: number }
        vatIncluded: { type: boolean }
        paymentTerms: { type: string }
        scopeDescription: { type: string }
    Engagement:
      type: object
      required: [id, dealId, professionalId, role, invitedByUserId, invitedByName, status, updatedAt, createdAt]
      properties:
        id: { type: integer }
        dealId: { type: integer }
        professionalId: { type: integer }
        role: { type: string }
        invitedByUserId: { type: string }
        invitedByName: { type: string }
        scope: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        status:
          type: string
          enum: [invited, interested, info_requested, proposal_sent, negotiation, appointed, active, declined, completed, cancelled]
        matchScore: { type: ["number", "null"] }
        matchReasons:
          type: ["array", "null"]
          items: { type: string }
        respondedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    EngagementWithProfessional:
      type: object
      required: [engagement, professional, permissions, feeProposals]
      properties:
        engagement: { $ref: "#/components/schemas/Engagement" }
        professional: { $ref: "#/components/schemas/Broker" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/DocumentPermission" }
        feeProposals:
          type: array
          items: { $ref: "#/components/schemas/FeeProposal" }
    DealTeamResponse:
      type: object
      required: [roles, members, canManage, documentCategories]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/DealTeamRole" }
        members:
          type: array
          items: { $ref: "#/components/schemas/EngagementWithProfessional" }
        canManage:
          type: boolean
          description: "Whether the viewer may invite/appoint professionals on this deal."
        documentCategories:
          type: array
          items: { type: string }
          description: "Data room categories on this deal, for permission grids."
    CandidateMatch:
      type: object
      required: [professional, matchScore, matchReasons]
      properties:
        professional: { $ref: "#/components/schemas/Broker" }
        matchScore: { type: number }
        matchReasons:
          type: array
          items: { type: string }
    TeamInvitationInput:
      type: object
      required: [professionalId, role, permissions]
      properties:
        professionalId: { type: integer }
        role: { type: string }
        scope: { type: string }
        message: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/DocumentPermission" }
        feeProposal: { $ref: "#/components/schemas/FeeProposalInput" }
    EngagementActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [interested, request_info, decline, appoint, activate, cancel, complete]
        message: { type: string }
    FeeProposalStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
    EngagementDealSummary:
      type: object
      required: [id, title, assetClass, country, city, confidential]
      properties:
        id: { type: integer }
        title: { type: string }
        assetClass: { type: string }
        country: { type: string }
        city: { type: string }
        confidential: { type: boolean }
        askingPrice: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
    MyEngagement:
      type: object
      required: [engagement, deal, permissions, feeProposals]
      properties:
        engagement: { $ref: "#/components/schemas/Engagement" }
        deal: { $ref: "#/components/schemas/EngagementDealSummary" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/DocumentPermission" }
        feeProposals:
          type: array
          items: { $ref: "#/components/schemas/FeeProposal" }
    BrokerProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/Broker"
            - type: "null"
    BrokerProfileInput:
      type: object
      required: [name, company, title, city, country]
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        yearsExperience: { type: integer, minimum: 0 }
        specialisations:
          type: array
          items: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
    Mandate:
      type: object
      required: [id, title, investorName, investorType, assetClasses, countries, minSize, maxSize, strategy, status, matches, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        investorName: { type: string }
        investorType: { type: string }
        assetClasses:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }
        minSize: { type: number }
        maxSize: { type: number }
        strategy: { type: string }
        yieldTarget: { type: ["number", "null"] }
        status: { type: string, enum: [active, paused, closed] }
        matches: { type: integer }
        isOwn: { type: boolean }
        createdAt: { type: string }
    MandateInput:
      type: object
      required: [title, investorName, investorType, assetClasses, countries, minSize, maxSize, strategy]
      properties:
        title: { type: string, minLength: 1 }
        investorName: { type: string, minLength: 1 }
        investorType: { type: string }
        assetClasses:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }
        minSize: { type: number }
        maxSize: { type: number }
        strategy: { type: string }
        yieldTarget: { type: number }
    MandateStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, closed] }
    Transaction:
      type: object
      required: [id, dealTitle, assetClass, country, city, price, currency, verified, closedAt, brokerName, buyerType]
      properties:
        id: { type: integer }
        dealTitle: { type: string }
        assetClass: { type: string }
        country: { type: string }
        city: { type: string }
        price: { type: number }
        currency: { type: string }
        verified: { type: boolean }
        closedAt: { type: string }
        brokerName: { type: string }
        buyerType: { type: string }
    MessageThread:
      type: object
      required: [id, subject, counterpartName, counterpartCompany, lastMessage, lastMessageAt, unread]
      properties:
        id: { type: integer }
        subject: { type: string }
        dealId: { type: ["integer", "null"] }
        counterpartName: { type: string }
        counterpartCompany: { type: string }
        lastMessage: { type: string }
        lastMessageAt: { type: string }
        unread: { type: integer }
    Message:
      type: object
      required: [id, threadId, senderName, body, fromMe, sentAt]
      properties:
        id: { type: integer }
        threadId: { type: integer }
        senderName: { type: string }
        body: { type: string }
        fromMe: { type: boolean }
        sentAt: { type: string }
    MessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    OwnerAssignment:
      type: object
      required: [id, ownerUserId, ownerName, title, propertyType, country, city, currency, goal, status, createdAt, isOwn]
      properties:
        id: { type: integer }
        ownerUserId: { type: string }
        ownerName: { type: string }
        ownerCompany: { type: ["string", "null"] }
        title: { type: string }
        propertyType: { type: string }
        country: { type: string }
        city: { type: string }
        areaSqm: { type: ["number", "null"] }
        indicativeValue: { type: ["number", "null"] }
        currency: { type: string }
        goal: { type: string, enum: [sell, lease, valuation] }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [open, closed] }
