      type: object
      required: [message, restricted, disclaimer]
      properties:
        message: { $ref: "#/components/schemas/AiAssistantMessage" }
        restricted: { type: boolean }
        disclaimer: { type: string }
    GenerateAiReportBody:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [deal_health, document_readiness, review_status]
