      type: object
      required: [id, category, name, required, sortOrder]
      properties:
        id: { type: integer }
        category: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        required: { type: boolean }
        sortOrder: { type: integer }
    ChecklistTemplate:
      type: object
      required: [id, name, createdAt, items]
      properties:
        id: { type: integer }
        name: { type: string }
        assetClass: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        dealType: { type: ["string", "null"] }
        transactionStructure: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistTemplateItem" }
    ChecklistTemplateInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1 }
        assetClass: { type: string }
        country: { type: string }
        dealType: { type: string }
        transactionStructure: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [category, name]
            properties:
              category: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
              description: { type: string }
              required: { type: boolean }
