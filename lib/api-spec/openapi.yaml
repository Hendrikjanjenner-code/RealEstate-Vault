openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RealEstate Vault API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: deals
  - name: brokers
  - name: mandates
  - name: access
  - name: auth
  - name: messages
  - name: dashboard
  - name: notifications
  - name: transactions
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /users/me/role:
    post:
      tags: [Auth]
      operationId: setMyRole
      summary: Set the current user's marketplace role (broker or investor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleBody'
      responses:
        '200':
          description: Role set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current session info
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List deals with optional filters
      parameters:
        - name: assetClass
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: dealType
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: savedOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deal" }
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a deal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get deal detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/save:
    patch:
      operationId: toggleSaveDeal
      tags: [deals]
      summary: Toggle saved state for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
  /deals/{id}/documents:
    get:
      operationId: listDealDocuments
      tags: [deals]
      summary: Data room documents for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealDocument" }
    post:
      operationId: createDealDocument
      tags: [deals]
      summary: Register an uploaded data room document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealDocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDocument" }
        "404":
          description: Deal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/documents/{docId}:
    patch:
      operationId: updateDealDocument
      tags: [deals]
      summary: Update a data room document's metadata (broker only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealDocumentUpdate" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDocument" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    delete:
      operationId: deleteDealDocument
      tags: [deals]
      summary: Delete a data room document (broker only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/documents/{docId}/download:
    get:
      operationId: downloadDealDocument
      tags: [deals]
      summary: Download a data room document (NDA-gated)
      description: |
        Streams the document file. NDA-required documents need an
        accessRequestId referencing a signed-NDA access request for the deal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: File stream
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: NDA not signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: File not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Object not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /deals/{id}/access-requests:
    post:
      operationId: requestDealAccess
      tags: [access]
      summary: Request confidential access to a deal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestCreateResult" }
  /access-requests:
    get:
      operationId: listAccessRequests
      tags: [access]
      summary: List access requests
      responses:
        "200":
          description: Access requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessRequest" }
  /access-requests/{id}:
    patch:
      operationId: updateAccessRequest
      tags: [access]
      summary: Advance an access request through its lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestUpdateResult" }
  /access-requests/{id}/sign:
    post:
      operationId: signAccessRequestNda
      tags: [access]
      summary: Investor signs the NDA for their own access request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignNdaInput" }
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
  /brokers:
    get:
      operationId: listBrokers
      tags: [brokers]
      summary: Ranked list of brokers
      responses:
        "200":
          description: Brokers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Broker" }
  /brokers/me:
    get:
      operationId: getMyBrokerProfile
      tags: [brokers]
      summary: The current broker's directory profile (null if not created yet)
      responses:
        "200":
          description: Profile envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerProfileEnvelope" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not a broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    put:
      operationId: upsertMyBrokerProfile
      tags: [brokers]
      summary: Create or update the current broker's directory profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "403":
          description: Not a broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /brokers/{id}:
    get:
      operationId: getBroker
      tags: [brokers]
      summary: Broker profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Broker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /brokers/{id}/deals:
    get:
      operationId: listBrokerDeals
      tags: [brokers]
      summary: Active listings owned by a broker profile (non-active deals are excluded)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The broker's deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deal" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /mandates:
    get:
      operationId: listMandates
      tags: [mandates]
      summary: List investor mandates
      responses:
        "200":
          description: Mandates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mandate" }
    post:
      operationId: createMandate
      tags: [mandates]
      summary: Create an acquisition mandate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mandate" }
  /mandates/{id}:
    patch:
      operationId: updateMandateStatus
      tags: [mandates]
      summary: Update a mandate's status (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateStatusInput" }
      responses:
        "200":
          description: Updated mandate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mandate" }
        "403":
          description: Not the mandate owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /mandates/{id}/matches:
    get:
      operationId: listMandateMatches
      tags: [mandates]
      summary: Deals matching a mandate's asset classes, countries, and size range
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Matching deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deal" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: Verified closed transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
  /threads:
    get:
      operationId: listThreads
      tags: [messages]
      summary: Message threads
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageThread" }
  /threads/{id}/messages:
    get:
      operationId: listThreadMessages
      tags: [messages]
      summary: Messages in a thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Current user's in-app notifications, newest first
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkNotificationsReadResult" }
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Aggregated dashboard KPIs and chart series
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }
  /dashboard/activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: [string, 'null']
          description: "broker | investor. Null until the user chooses a role."
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    SetRoleBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [broker, investor]
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Deal:
      type: object
      required:
        [id, title, dealType, assetClass, country, city, currency, status, confidential, saved, views, accessRequests, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        dealType: { type: string }
        assetClass: { type: string }
        country: { type: string }
        city: { type: string }
        region: { type: ["string", "null"] }
        locationPrivacy: { type: ["string", "null"] }
        askingPrice: { type: ["number", "null"] }
        priceMax: { type: ["number", "null"] }
        currency: { type: string }
        grossYield: { type: ["number", "null"] }
        netYield: { type: ["number", "null"] }
        areaSqm: { type: ["number", "null"] }
        keys: { type: ["integer", "null"] }
        constructionYear: { type: ["integer", "null"] }
        occupancyPct: { type: ["number", "null"] }
        status: { type: string }
