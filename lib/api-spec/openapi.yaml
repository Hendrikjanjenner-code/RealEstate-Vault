        assignedToName: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, under_review, information_requested, resolved, accepted_risk, not_applicable]
        createdByName: { type: string }
        detectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        comments:
          type: array
          items: { $ref: "#/components/schemas/RiskComment" }
    DealRiskInput:
      type: object
      required: [title, category, severity]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        category:
          type: string
          enum: [financial, legal, tax, technical, financing, documentation, other]
        severity:
          type: string
          enum: [critical, high, medium, low, informational]
        source: { type: string }
        assignedToName: { type: string }
    DealRiskUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, under_review, information_requested, resolved, accepted_risk, not_applicable]
        severity:
          type: string
          enum: [critical, high, medium, low, informational]
        assignedToName: { type: string }
