kind = "slides"
previewPath = "/vault-deck/"
title = "Closa Deck"
description = "A 16-slide presentation about Closa — the infrastructure behind private transactions. Covers the problem, the NDA-gated access model, product features, the Closa brand identity, tech stack, and roadmap."
version = "1.0.0"
id = "artifacts/vault-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/vault-deck/" ]
localPort = 23723

[services.development]
run = "pnpm --filter @workspace/vault-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vault-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/vault-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23723"
BASE_PATH = "/vault-deck/"
